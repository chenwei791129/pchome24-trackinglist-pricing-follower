name: Build and Push Docker Image

# The build itself lives in chenwei791129/.github so the pinned action versions
# are maintained in exactly one place across repositories. This project already
# published to ghcr.io only; the image reference is unchanged.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: chenwei791129/.github/.github/workflows/build-and-push-image.yml@main
    with:
      # image-name is omitted: this project publishes under its full
      # owner/repository path, which is the shared workflow's default.
      #
      # latest is tagged on default-branch pushes rather than the shared
      # latest=auto flavor, which would only apply it to semver tags.
      enable-latest-tag: false
      additional-tags: |
        type=sha,prefix=
        type=raw,value=latest,enable={{is_default_branch}}
